<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d63ed" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
    <linearGradient id="boxInnerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="boxOuterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="1000" fill="url(#bgGrad)" />

  <!-- Motion Paths / Curved Dashed Lines -->
  <g stroke="#ffffff" stroke-width="2.5" stroke-dasharray="10 10" fill="none" opacity="0.35">
    <path d="M -50 150 C 200 50, 450 120, 550 20" />
    <path d="M -20 500 C 300 400, 600 650, 950 350" />
    <circle cx="880" cy="280" r="120" stroke-dasharray="8 8" stroke-width="2" />
    <circle cx="150" cy="500" r="180" stroke-dasharray="6 6" stroke-width="1.5" />
  </g>

  <!-- Floating Cubes in Background -->
  <g stroke="#ffffff" stroke-width="2" fill="none" opacity="0.35">
    <path d="M 580 200 L 610 185 L 640 200 L 640 230 L 610 245 L 580 230 Z M 610 185 L 610 245 M 640 200 L 610 215 L 580 200" />
    <path d="M 50 480 L 80 465 L 110 480 L 110 510 L 80 525 L 50 510 Z M 80 465 L 80 525 M 110 480 L 80 495 L 50 480" />
  </g>

  <!-- Top Right Magnolia Tree Branch & Hanging Barcode Tag -->
  <g stroke="#ffffff" stroke-width="3" fill="none">
    <!-- Branch -->
    <path d="M 780 60 C 820 120, 880 150, 1020 180 M 880 150 C 930 220, 970 280, 1020 330 M 920 110 C 960 140, 1000 170, 1020 200" opacity="0.9" />
    
    <!-- Magnolia Flowers -->
    <path d="M 800 110 C 780 70, 820 50, 850 80 C 870 100, 850 130, 800 110 Z" fill="#93c5fd" fill-opacity="0.8" />
    <path d="M 830 120 C 800 80, 840 60, 870 90 C 890 110, 870 140, 830 120 Z" fill="#60a5fa" fill-opacity="0.7" />
    <path d="M 970 230 C 950 190, 980 170, 1000 190 C 1020 210, 1000 240, 970 230 Z" fill="#93c5fd" fill-opacity="0.8" />

    <!-- Hanging Tag with Barcode -->
    <path d="M 920 410 Q 940 430 960 410" stroke-width="2" />
    <g transform="translate(860, 430) rotate(25)">
      <rect x="0" y="0" width="70" height="45" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.5" />
      <circle cx="12" cy="22.5" r="4" fill="#1d4ed8" />
      <!-- Barcode lines on tag -->
      <line x1="28" y1="10" x2="28" y2="35" stroke="#1d4ed8" stroke-width="3" />
      <line x1="35" y1="10" x2="35" y2="35" stroke="#1d4ed8" stroke-width="1.5" />
      <line x1="40" y1="10" x2="40" y2="35" stroke="#1d4ed8" stroke-width="4" />
      <line x1="48" y1="10" x2="48" y2="35" stroke="#1d4ed8" stroke-width="2" />
      <line x1="55" y1="10" x2="55" y2="35" stroke="#1d4ed8" stroke-width="3" />
    </g>
  </g>

  <!-- Flying Paper Airplane -->
  <g transform="translate(710, 290) rotate(-20) scale(1.3)">
    <polygon points="0,20 70,0 40,45 28,28" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.5" />
    <polygon points="28,28 70,0 40,45" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" />
    <path d="M -25 30 Q -10 26 0 20" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="4 4" fill="none" />
  </g>

  <!-- Bottom Right Leaves / Foliage -->
  <g stroke="#ffffff" stroke-width="2.5" fill="none">
    <path d="M 800 1000 Q 860 850, 1000 800 M 880 920 Q 940 780, 1000 700 M 780 880 Q 820 780, 920 720" />
    <!-- Leaf shapes -->
    <path d="M 840 780 Q 890 730, 930 780 Q 880 830, 840 780 Z" fill="#60a5fa" fill-opacity="0.6" />
    <path d="M 910 700 Q 960 650, 1000 700 Q 950 750, 910 700 Z" fill="#93c5fd" fill-opacity="0.7" />
    <path d="M 880 850 Q 930 800, 970 850 Q 920 900, 880 850 Z" fill="#3b82f6" fill-opacity="0.8" />
  </g>

  <!-- Bottom Left Foliage -->
  <g stroke="#ffffff" stroke-width="2.5" fill="none">
    <path d="M 0 750 Q 120 720, 180 950 M 50 850 Q 150 800, 220 1000" />
    <path d="M 120 710 Q 160 660, 200 710 Q 160 760, 120 710 Z" fill="#93c5fd" fill-opacity="0.7" />
    <path d="M 60 780 Q 100 730, 140 780 Q 100 830, 60 780 Z" fill="#60a5fa" fill-opacity="0.6" />
  </g>

  <!-- MAIN WAREHOUSE EQUIPMENT ILLUSTRATION (Center Bottom) -->
  
  <!-- 1. Open Shipping Cardboard Box -->
  <g transform="translate(150, 620)">
    <!-- Main Box Body Base -->
    <polygon points="120,80 380,80 440,180 180,180" fill="url(#boxInnerGrad)" stroke="#ffffff" stroke-width="3" />
    <polygon points="60,180 320,180 320,330 60,330" fill="#2563eb" stroke="#ffffff" stroke-width="3" />
    <polygon points="320,180 440,180 440,330 320,330" fill="#1d4ed8" stroke="#ffffff" stroke-width="3" />

    <!-- Open Flaps -->
    <polygon points="60,180 180,180 140,110 20,110" fill="#3b82f6" stroke="#ffffff" stroke-width="3" />
    <polygon points="320,180 440,180 480,110 360,110" fill="#3b82f6" stroke="#ffffff" stroke-width="3" />
    <polygon points="60,180 320,180 260,120 0,120" fill="#60a5fa" fill-opacity="0.9" stroke="#ffffff" stroke-width="3" />
    <polygon points="320,180 440,180 500,120 380,120" fill="#3b82f6" stroke="#ffffff" stroke-width="3" />

    <!-- Barcode Label on Box Front -->
    <rect x="110" y="220" width="120" height="65" rx="4" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" />
    <line x1="125" y1="230" x2="125" y2="270" stroke="#1d4ed8" stroke-width="4" />
    <line x1="133" y1="230" x2="133" y2="270" stroke="#1d4ed8" stroke-width="2" />
    <line x1="140" y1="230" x2="140" y2="270" stroke="#1d4ed8" stroke-width="5" />
    <line x1="150" y1="230" x2="150" y2="270" stroke="#1d4ed8" stroke-width="2" />
    <line x1="158" y1="230" x2="158" y2="270" stroke="#1d4ed8" stroke-width="3" />
    <line x1="168" y1="230" x2="168" y2="270" stroke="#1d4ed8" stroke-width="6" />
    <line x1="180" y1="230" x2="180" y2="270" stroke="#1d4ed8" stroke-width="2" />
    <line x1="188" y1="230" x2="188" y2="270" stroke="#1d4ed8" stroke-width="4" />
    <line x1="198" y1="230" x2="198" y2="270" stroke="#1d4ed8" stroke-width="3" />
    <line x1="208" y1="230" x2="208" y2="270" stroke="#1d4ed8" stroke-width="5" />
  </g>

  <!-- 2. Wireless Barcode Scanner (Standing inside Box) -->
  <g transform="translate(360, 520) rotate(-10)">
    <!-- Handle -->
    <path d="M 40 100 L 25 190 Q 20 205 35 210 L 55 210 Q 70 205 60 190 L 60 100 Z" fill="#1e293b" stroke="#ffffff" stroke-width="3" />
    <!-- Trigger -->
    <path d="M 32 120 Q 20 130 32 145 Z" fill="#0284c7" stroke="#ffffff" stroke-width="2" />
    <!-- Main Head -->
    <path d="M 10 30 Q 30 0 70 0 Q 100 0 105 35 L 90 95 Q 50 110 15 95 Z" fill="#0f172a" stroke="#ffffff" stroke-width="3.5" />
    <!-- Blue Glow Light Window -->
    <ellipse cx="60" cy="40" rx="30" ry="12" fill="#38bdf8" filter="url(#glow)" />
    <ellipse cx="60" cy="40" rx="20" ry="6" fill="#ffffff" />
    <!-- Red Laser Beam Effect -->
    <polygon points="60,40 -20,200 140,200" fill="#00f0ff" fill-opacity="0.15" />
  </g>

  <!-- 3. Clipboard Checklist (Standing Right Side) -->
  <g transform="translate(560, 520) rotate(8)">
    <!-- Board -->
    <rect x="0" y="0" width="190" height="260" rx="16" fill="#2563eb" stroke="#ffffff" stroke-width="3.5" />
    <!-- Paper -->
    <rect x="12" y="25" width="166" height="225" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" />
    <!-- Clip -->
    <rect x="65" y="-10" width="60" height="25" rx="6" fill="#1e293b" stroke="#ffffff" stroke-width="2.5" />
    <circle cx="95" cy="2" r="4" fill="#ffffff" />

    <!-- Checklist Items -->
    <!-- Item 1 -->
    <rect x="28" y="55" width="18" height="18" rx="3" fill="#ffffff" stroke="#2563eb" stroke-width="2.5" />
    <path d="M 30 63 L 35 68 L 43 58" stroke="#2563eb" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="56" y1="60" x2="150" y2="60" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <line x1="56" y1="68" x2="120" y2="68" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />

    <!-- Item 2 -->
    <rect x="28" y="100" width="18" height="18" rx="3" fill="#ffffff" stroke="#2563eb" stroke-width="2.5" />
    <path d="M 30 108 L 35 113 L 43 103" stroke="#2563eb" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="56" y1="105" x2="155" y2="105" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <line x1="56" y1="113" x2="130" y2="113" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />

    <!-- Item 3 -->
    <rect x="28" y="145" width="18" height="18" rx="3" fill="#ffffff" stroke="#2563eb" stroke-width="2.5" />
    <path d="M 30 153 L 35 158 L 43 148" stroke="#2563eb" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="56" y1="150" x2="145" y2="150" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <line x1="56" y1="158" x2="110" y2="158" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- 4. Sealed Box (Bottom Right) -->
  <g transform="translate(650, 740)">
    <polygon points="0,40 120,0 240,40 120,80" fill="#3b82f6" stroke="#ffffff" stroke-width="3" />
    <polygon points="0,40 120,80 120,180 0,140" fill="#1d4ed8" stroke="#ffffff" stroke-width="3" />
    <polygon points="120,80 240,40 240,140 120,180" fill="#1e40af" stroke="#ffffff" stroke-width="3" />

    <!-- Tape Line -->
    <polygon points="60,20 120,40 180,20 120,0" fill="#bfdbfe" fill-opacity="0.8" />
    <line x1="120" y1="40" x2="120" y2="180" stroke="#bfdbfe" stroke-width="3" stroke-opacity="0.8" />
    
    <!-- Up Arrow Icon on Box -->
    <g transform="translate(140, 110)" stroke="#ffffff" stroke-width="3" fill="none">
      <path d="M 10 30 L 10 10 M 5 15 L 10 10 L 15 15" stroke-linecap="round" />
      <path d="M 25 30 L 25 10 M 20 15 L 25 10 L 30 15" stroke-linecap="round" />
    </g>
  </g>

  <!-- 5. Roll of Packing Tape (Center Foreground) -->
  <g transform="translate(540, 850)">
    <ellipse cx="50" cy="30" rx="50" ry="25" fill="#1e293b" stroke="#ffffff" stroke-width="3" />
    <ellipse cx="50" cy="30" rx="32" ry="16" fill="#2563eb" stroke="#ffffff" stroke-width="2" />
    <ellipse cx="50" cy="30" rx="22" ry="11" fill="#1d63ed" stroke="#ffffff" stroke-width="2" />
    <!-- Tape Height Side -->
    <path d="M 0 30 L 0 50 C 0 68 100 68 100 50 L 100 30" fill="#1e293b" stroke="#ffffff" stroke-width="3" />
  </g>

  <!-- Bottom Smooth Ocean/Wave Curve Overlay -->
  <path d="M -50 820 Q 250 780 500 880 T 1050 850 L 1050 1050 L -50 1050 Z" fill="#1d4ed8" fill-opacity="0.3" />
  <path d="M -50 880 Q 300 820 600 940 T 1050 900 L 1050 1050 L -50 1050 Z" fill="#2563eb" fill-opacity="0.4" />
</svg>
